[package]
name = "carmen"
version = "1.0.0"
description = "Carmen — offline-first, cross-platform music player"
authors = ["Samma3ni"]
edition = "2021"
rust-version = "1.77.2"

# The Android / iOS crates link against the mobile target triple; keep the lib
# name free of dashes so `cbindgen`-style tooling stays happy.
[lib]
name = "carmen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
