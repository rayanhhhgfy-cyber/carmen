name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only: CI never creates releases and needs no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root deps (Tauri CLI)
        # Root package-lock.json exists in the working tree but is not
        # committed yet — fall back to `npm install` until it is, so CI stays
        # green-able. (frontend/package-lock.json IS tracked → strict npm ci.)
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vite production build
        # NOTE: `npm run build` at the repo root runs
        # `typecheck && build:frontend && tauri build`, i.e. it would also do a
        # full Rust bundle. The frontend-only script (which itself runs
        # `tsc --noEmit && vite build`) is the right CI gate here; the desktop
        # bundle is produced by build-desktop.yml on tags.
        run: npm run build:frontend

  rust:
    name: cargo check (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (Tauri webkit/appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  server:
    name: Server sanity check (never runs the server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Create venv and install requirements
        # Always a fresh 3.11 venv — mirrors ./venv locally (system python may
        # be a different major version and is never used).
        run: |
          python -m venv venv
          ./venv/bin/pip install -r server/requirements.txt

      - name: Byte-compile the server package
        run: ./venv/bin/python -m compileall -q server

      - name: Import the FastAPI app (safe at import time)
        # `server/__main__.py` only builds the FastAPI app at import time.
        # The YTMusic client (browser.json), the Redis client and the Telegram
        # client are all created inside the `lifespan` hook, which never runs
        # for a plain import — so no secrets, cookies or Redis are needed.
        # CI must NOT start the server (`./venv/bin/python -m server`).
        run: ./venv/bin/python -c "import server.__main__"
