# ── Carmen · web client ──────────────────────────────────────────────────────
#
# Static vhost for the production build of `frontend/`, served on port 5432.
#
# Install & start:
#   1. build the client
#        cd frontend && VITE_API_BASE=https://api.<your-host> npm run build
#   2. copy the output
#        sudo mkdir -p /var/www/carmen
#        sudo cp -r frontend/dist/. /var/www/carmen/
#   3. enable this vhost (Debian/Ubuntu: conf.d is included by default; on
#      RHEL/Fedora the same directory is included by the stock nginx.conf)
#        sudo cp deploy/nginx.conf /etc/nginx/conf.d/carmen.conf
#   4. test + start
#        sudo nginx -t && sudo systemctl enable --now nginx
#      (already running?  sudo systemctl reload nginx)
#
# The client is a HashRouter SPA — every route lives after the `#`, so for
# normal use the server only ever sees `/` and `/assets/*`. The one exception
# is a *share* link (`/?song=…`, `/?search=…`), whose query-string reaches the
# server so the API can render Open Graph preview tags for Telegram/Discord —
# see the `location = /` block below.
#
# Plain HTTP on 5432 by design. iOS *Add to Home Screen* (and the browser's
# persistent storage) wants HTTPS — put a TLS terminator in front (Caddy, or
# another `server { listen 443 ssl; ... }` block proxying to this one) when
# the app should install as a home-screen PWA.

server {
    listen 5432;
    listen [::]:5432;
    server_name _;

    root /var/www/carmen;
    index index.html;

    # Arabic titles and metadata are UTF-8 everywhere text is served.
    charset utf-8;

    # The shell's name never changes — always revalidate it so a deploy is
    # live on the next page load, never "whenever the cache expires".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite stamps every file under /assets/ with its content hash, so the
    # browser may keep them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Real files first (favicon, robots, …); the SPA shell otherwise.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The share-preview shell. Telegram/Discord crawlers never execute the JS
    # router, so a song/search link (`/?song=…`, `/?search=…`) has to come back
    # with Open Graph tags already in the HTML — that means rendering the shell
    # through the API, not serving the static file. `location = /` is an exact
    # match that beats the prefix locations above, and `proxy_pass` carries the
    # share query-string through so the API can resolve the song/search
    # metadata. The client's own asset loading and hash routing are unaffected
    # (the hash never reaches the server). Point this at wherever the API
    # listens — if nginx and the API share a host, the default
    # http://127.0.0.1:8000 works.
    location = / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache the shell — a song link's preview must re-resolve.
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
